# =========================
# ?? App & Server
# =========================
spring.application.name=identity_service
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/v1/identity}

# =========================
# ?? Database (MySQL)
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/identity_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123123}

# =========================
# ? JPA / Hibernate
#   - validate | update | create | create-drop
# =========================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

# =========================
# ? JWT (Common)
# =========================
jwt.issuer=${JWT_ISSUER:com.namudev.identity_service}

# =========================
# ? JWT - Access Token
#   - TTL: ISO-8601 Duration (PT15M = 15 phút)
#   - Secret: Base64-encoded (>= 64 bytes cho HS512)
# =========================
jwt.access.ttl=${JWT_ACCESS_TTL:PT15M}
jwt.access.secret-key=${JWT_ACCESS_SECRET_KEY:CHANGE_ME_ACCESS_KEY_BASE64}

# =========================
# ? JWT - Refresh Token
#   - TTL: P7D = 7 ngày
#   - Secret: KHÁC access key (Base64, >= 64B)
# =========================
jwt.refresh.ttl=${JWT_REFRESH_TTL:P7D}
jwt.refresh.secret-key=${JWT_REFRESH_SECRET_KEY:CHANGE_ME_REFRESH_KEY_BASE64}

# =========================
# Logging
# =========================
logging.level.org.springframework=${SPRING_LOG_LEVEL:INFO}
logging.level.com.namudev.identity_service=${APP_LOG_LEVEL:DEBUG}
logging.level.io.lettuce.core=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.data.redis=${APP_LOG_LEVEL:INFO}

# =========================
# Redis Cloud
# =========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USER:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}
spring.data.redis.timeout=${REDIS_TIMEOUT:5s}

# =========================
# Google OAuth2
# =========================
google.oauth2.client_id=${GOOGLE_OAUTH2_CLIENT_ID}
google.oauth2.client_secret=${GOOGLE_OAUTH2_CLIENT_SECRET}
google.oauth2.redirect_uri=${GOOGLE_OAUTH2_REDIRECT_URI:http://localhost:3000/authenticate}
google.oauth2.grant_type=${GOOGLE_OAUTH2_GRANT_TYPE:authorization_code}
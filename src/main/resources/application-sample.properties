# =========================
# ?? App & Server
# =========================
spring.application.name=identity_service
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api/v1/identity}

# =========================
# ?? Database (MySQL)
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/identity_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123123}

# =========================
# ? JPA / Hibernate
#   - validate | update | create | create-drop
# =========================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

# =========================
# ? JWT (Common)
# =========================
jwt.issuer=${JWT_ISSUER:com.namudev.identity_service}

# =========================
# ? JWT - Access Token
#   - TTL: ISO-8601 Duration (PT15M = 15 phút)
#   - Secret: Base64-encoded (>= 64 bytes cho HS512)
# =========================
jwt.access.ttl=${JWT_ACCESS_TTL:PT15M}
jwt.access.secret-key=${JWT_ACCESS_SECRET_KEY:CHANGE_ME_ACCESS_KEY_BASE64}

# =========================
# ? JWT - Refresh Token
#   - TTL: P7D = 7 ngày
#   - Secret: KHÁC access key (Base64, >= 64B)
# =========================
jwt.refresh.ttl=${JWT_REFRESH_TTL:P7D}
jwt.refresh.secret-key=${JWT_REFRESH_SECRET_KEY:CHANGE_ME_REFRESH_KEY_BASE64}

# =========================
# ? Logging (optional)
# =========================
# logging.level.root=${LOG_LEVEL:INFO}
# logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
# logging.level.com.namudev.identity_service=${APP_LOG_LEVEL:DEBUG}

# =========================
# ? Profiles (g?i ý)
# =========================
# spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =========================
# Logging
# =========================
logging.level.org.springframework=${SPRING_LOG_LEVEL:INFO}
logging.level.com.namudev.identity_service=${APP_LOG_LEVEL:DEBUG}